<title>속도와 가속도 탐구실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* Layout: 왼쪽 큰 캔버스 = x(t) 그래프의 세로축이 곧 수직선(물체가 그 위를 움직임), 아래로 v(t)·a(t)가 같은 t축에 붙음.
   오른쪽 패널 = 식 · 현재 값 · 상태 · 조작. 색은 다른 탐구실과 같음: +/증가 주황, −/감소 파랑, 0 초록, 조작 보라. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --panel2:#f6f8fb; --ink:#1a2233; --muted:#677187; --line:#d6dce6; --grid:#e9edf3;
  --up:#d6451b; --down:#1e62c4; --flat:#23863b; --handle:#6b4cc0; --handle-ink:#ffffff;
  --up-bg:#fbe9e2; --down-bg:#e3ecf9; --flat-bg:#e2f2e5;
  --font-ui:"IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --font-math:"STIX Two Text", "Times New Roman", "Batang", serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171c27; --panel2:#131823; --ink:#e6eaf2; --muted:#97a1b4; --line:#2a3242; --grid:#212938;
  --up:#ff7d4d; --down:#5ea4ff; --flat:#55c56e; --handle:#a690ff; --handle-ink:#ffffff;
  --up-bg:#3a2119; --down-bg:#17263d; --flat-bg:#173021; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --panel2:#131823; --ink:#e6eaf2; --muted:#97a1b4; --line:#2a3242; --grid:#212938;
  --up:#ff7d4d; --down:#5ea4ff; --flat:#55c56e; --handle:#a690ff; --handle-ink:#ffffff;
  --up-bg:#3a2119; --down-bg:#17263d; --flat-bg:#173021; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
.app{height:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ttl{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.top h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .sub{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);padding:7px 14px;min-height:36px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--handle);outline-offset:2px}

.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
.leftcol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.leftcol .stage{flex:1 1 auto}
.playbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.playbar input[type=range]{flex:1 1 auto;min-width:80px}
.playbar .seg{flex:0 0 auto}
.playbar .seg button{padding:6px 10px;font-size:12.5px;white-space:nowrap}
.playbar .btn{white-space:nowrap}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{gap:8px}
.opts summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
.opts summary::before{content:"＋ ";color:var(--handle)}
.opts[open] summary::before{content:"－ "}
.stage{position:relative;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:15px;font-weight:700;padding:7px 16px;border-radius:999px;
  background:var(--ink);color:var(--surface);white-space:nowrap;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.toast.show{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.cap b{color:var(--ink);font-weight:700}
.frow{display:flex;align-items:baseline;gap:8px;min-width:0}
.lab{flex:0 0 52px;white-space:nowrap;font-family:var(--font-math);font-style:italic;font-size:16px;color:var(--muted)}
.ex{font-family:var(--font-math);font-size:18px;line-height:1.35;min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.ex::-webkit-scrollbar{display:none}
.ex i{font-style:italic}
.ex sup{font-size:.62em;vertical-align:.55em;line-height:0}
.ex .txt{font-family:var(--font-ui);font-size:13px;color:var(--muted)}
.ex .on{background:var(--handle);color:var(--handle-ink);border-radius:5px;padding:0 5px}

.read{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.cell{display:flex;flex-direction:column;gap:0;min-width:0}
.cell .k{font-size:11.5px;color:var(--muted);font-weight:500}
.cell .k i{font-family:var(--font-math);font-size:14px}
.cell .val{font-family:var(--font-math);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.cell .val small{font-size:13px;color:var(--muted);margin-left:3px;font-family:var(--font-ui)}
.cell .spd{font-size:12px;color:var(--muted)}
.cell .spd b{font-family:var(--font-math);font-size:15px;color:var(--ink);font-weight:600}
.pos{color:var(--up)} .neg{color:var(--down)} .zer{color:var(--flat)}

.states{display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st .k{font-size:12.5px;color:var(--muted)}
.pill{font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px;white-space:nowrap;border:1.5px solid transparent}
.pill.pos{background:var(--up-bg);border-color:var(--up)}
.pill.neg{background:var(--down-bg);border-color:var(--down)}
.pill.zer{background:var(--flat-bg);border-color:var(--flat)}
.pill.neu{background:var(--panel2);border-color:var(--line);color:var(--ink)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip small{font-weight:500;color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--handle);border-color:var(--handle);color:var(--handle-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.btn{font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn.primary{background:var(--handle);border-color:var(--handle);color:var(--handle-ink);min-width:88px}
.prow{display:flex;gap:8px;align-items:center}
.prow{flex-wrap:wrap}
.prow .seg{flex:1 1 100%}
.prow .btn{white-space:nowrap}
#bookCtl .prow .btn{flex:1 1 0}
.prow .seg button{flex:1 1 0;padding:7px 4px;font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--handle);margin:2px 0}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
details summary::before{content:"＋ ";color:var(--handle)}
details[open] summary::before{content:"－ "}
.custom{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.custom label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.custom input{font-family:var(--font-math);font-size:17px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.custom .xin{flex:1 1 auto}
.custom .tin{width:64px}
.err{font-size:12px;color:var(--up);min-height:1em}

.drivebar{display:flex;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.drivebar #bUp,.drivebar #bDown{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:14px}
.drivebar .btn{white-space:nowrap;align-self:center}
.pad .ax{font-family:var(--font-math);font-style:italic;font-size:26px;font-weight:600;white-space:nowrap}
.pad #bUp,.pad #bDown{font-family:var(--font-ui);font-size:17px;font-weight:700;border-radius:12px;min-height:52px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid}
#bUp{background:var(--up-bg);border-color:var(--up);color:var(--up)}
#bDown{background:var(--down-bg);border-color:var(--down);color:var(--down)}
.pad button.held{filter:brightness(.92);transform:scale(.98)}
.pad small{display:block;font-size:12px;font-weight:500;opacity:.85;font-family:var(--font-math)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons button{font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;width:38px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icons button .nm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.icons button .em{font-family:var(--font-emoji);font-size:19px;display:inline-flex}
.icons button .em img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.icons{display:flex;gap:4px}
.icons button[aria-pressed="true"]{border-color:var(--handle);box-shadow:inset 0 0 0 1.5px var(--handle);background:var(--panel2)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;cursor:pointer}
.tg input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin:0;transition:background .15s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.tg input:checked{background:var(--handle)}
.tg input:checked::after{left:19px}

@media (max-width:860px){
  html,body{height:auto} body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .stage{height:min(64vh,600px);min-height:380px}
  .side{overflow:visible}
  .playbar{flex-wrap:wrap}
  .playbar input[type=range]{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion: reduce){ .toast.show{animation:none} }
</style>

<div class="app">
  <header class="top">
    <div class="ttl"><h1>속도와 가속도 탐구실</h1><span class="sub">교과서 103~106쪽 · 수직선 위를 움직이는 점</span></div>
    <div class="hr">
    <div class="icons" id="icons" aria-label="타는 것"></div>
    <input type="file" id="photoIn" accept="image/*" hidden>
    <div class="seg" id="modeSeg">
      <button id="mBook" aria-pressed="true">교과서 운동</button>
      <button id="mDrive" aria-pressed="false">직접 운전</button>
    </div>
    </div>
  </header>

  <div class="main">
    <div class="leftcol">
    <div class="playbar" id="playbar">
      <button class="btn primary" id="bPlay">▶ 재생</button>
      <button class="btn" id="bReset">처음으로</button>
      <input type="range" id="tSlider" min="0" max="1000" value="0" aria-label="시각 t">
      <div class="seg" id="spdSeg">
        <button data-s="16" aria-pressed="false">느리게</button>
        <button data-s="8" aria-pressed="true">보통</button>
        <button data-s="4" aria-pressed="false">빠르게</button>
      </div>
    </div>
    <div class="drivebar pad" id="driveCtl" hidden>
      <button id="bUp" title="누르는 동안만 밀어요 (키보드 ↑)">▲ 위로 밀기 <span class="ax">a = +2</span></button>
      <button id="bDown" title="누르는 동안만 밀어요 (키보드 ↓)">▼ 아래로 밀기 <span class="ax">a = −2</span></button>
      <button class="btn" id="bDReset">처음부터</button>
    </div>
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="수직선 위 물체와 위치·속도·가속도 그래프"></canvas>
      <div class="toast" id="toast" hidden></div>
    </section>
    </div>

    <aside class="side">
      <div class="card" id="fCard">
        <div class="cap"><span id="pTitle"><b>예제 2</b> 쏘아 올린 물체</span><span id="pPage">105쪽</span></div>
        <div class="frow"><span class="lab">x(t) =</span><span class="ex" id="fx"></span></div>
        <div class="frow"><span class="lab">v(t) =</span><span class="ex" id="fv"></span></div>
        <div class="frow"><span class="lab">a(t) =</span><span class="ex" id="fa"></span></div>
      </div>

      <div class="card">
      <div class="read">
        <div class="cell"><span class="k">시각 <i>t</i></span><span class="val" id="rT"></span></div>
        <div class="cell"><span class="k">위치 <i>x</i></span><span class="val" id="rX"></span></div>
        <div class="cell"><span class="k">속도 <i>v</i></span><span class="val" id="rV"></span><span class="spd">속력 |<i>v</i>| = <b id="rS"></b></span></div>
        <div class="cell"><span class="k">가속도 <i>a</i></span><span class="val" id="rA"></span></div>
      </div>
      <div class="states">
        <div class="st"><span class="k">운동 방향</span><span class="pill" id="pDir"></span></div>
        <div class="st"><span class="k">속력</span><span class="pill" id="pSpd"></span></div>
        <div class="st" id="bodyRow" hidden><span class="k">탄 사람 몸무게 느낌</span><span class="pill" id="pBody"></span></div>
      </div>
      </div>

      <div class="card" id="bookCtl">
        <div class="chips" id="chips"></div>
        <details id="custDet">
          <summary>식 직접 입력</summary>
          <div class="custom">
            <label><span style="font-family:var(--font-math);font-style:italic;font-size:16px">x(t) =</span><input class="xin" id="cx" value="-5t^2+20t+25" autocomplete="off" spellcheck="false"></label>
            <label><span style="font-family:var(--font-math);font-style:italic">t</span> 범위 <input class="tin" id="c0" type="number" value="0" step="any"> ~ <input class="tin" id="c1" type="number" value="5" step="any"> <button class="btn" id="cGo">적용</button></label>
            <div class="err" id="cErr"></div>
          </div>
        </details>
      </div>


      <details class="card opts">
        <summary>보기 옵션</summary>
        <label class="tg">전체 그래프 미리 보기<input type="checkbox" id="oPrev" checked></label>
        <label class="tg">진행 방향으로 돌아보기<input type="checkbox" id="oFace"></label>
        <label class="tg">직접 운전 불꽃<input type="checkbox" id="oFlame" checked></label>
      </details>
    </aside>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const MINUS='−';
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');

/* ---------- 수식 도우미 ---------- */
function fmt(n,d=2){ if(!isFinite(n)) return '—'; if(Math.abs(n)<0.5*Math.pow(10,-d)) return '0'; return String(+n.toFixed(d)).replace('-',MINUS); }
function cnum(n){ return String(+(+n).toFixed(4)); }
function polyHTML(c){
  const terms=[];
  for(let k=c.length-1;k>=0;k--){ const a=c[k]; if(Math.abs(a)<1e-10) continue;
    const m=Math.abs(a); const coef=(k>0&&Math.abs(m-1)<1e-10)?'':cnum(m);
    const v=k===0?'':(k===1?'<i>t</i>':`<i>t</i><sup>${k}</sup>`); terms.push({neg:a<0,s:coef+v}); }
  if(!terms.length) return '0';
  return terms.map((t,i)=>i===0?(t.neg?MINUS:'')+t.s:(t.neg?` ${MINUS} `:' + ')+t.s).join('');
}
const pEval=(c,t)=>{let r=0;for(let k=c.length-1;k>=0;k--)r=r*t+c[k];return r};
const pDer=c=>{const d=[];for(let k=1;k<c.length;k++)d.push(k*c[k]);return d.length?d:[0]};
function fromPoly(c){ const d1=pDer(c),d2=pDer(d1);
  return {x:t=>pEval(c,t),v:t=>pEval(d1,t),a:t=>pEval(d2,t),xh:polyHTML(c),vh:polyHTML(d1),ah:polyHTML(d2)}; }

/* 엘리베이터: 4초 동안 8 m 올라가 2초 멈춤, 4초 동안 내려와 1초 멈춤 */
const EH=8, sm=u=>u*u*(3-2*u), dsm=u=>6*u*(1-u), ddsm=u=>6-12*u;
const elevator={
  x:t=>t<4?EH*sm(t/4):t<6?EH:t<10?EH-EH*sm((t-6)/4):0,
  v:t=>t<4?EH*dsm(t/4)/4:t<6?0:t<10?-EH*dsm((t-6)/4)/4:0,
  a:t=>t<4?EH*ddsm(t/4)/16:t<6?0:t<10?-EH*ddsm((t-6)/4)/16:0,
  xh:'<span class="txt">8 m 올라가 멈췄다가 다시 내려옴</span>',
  vh:'<span class="txt">위치를 미분</span>', ah:'<span class="txt">속도를 미분</span>'
};

const PRESETS=[
  {id:'open',chip:'생각 열기',title:'곧게 뻗은 철도 위 기차',page:'103쪽',t0:0,t1:20,unit:true,...fromPoly([0,6,2])},
  {id:'ex1',chip:'예제 1',title:'원점에서 출발한 점 P',page:'104쪽',t0:0,t1:2.2,unit:false,...fromPoly([0,-1,-1,1])},
  {id:'pr1',chip:'문제 1',title:'원점에서 출발한 점 P',page:'104쪽',t0:0,t1:6,unit:false,...fromPoly([0,15,-9,1])},
  {id:'ex2',chip:'예제 2',title:'쏘아 올린 물체',page:'105쪽',t0:0,t1:5,unit:true,...fromPoly([25,20,-5])},
  {id:'pr2',chip:'문제 2',title:'제동을 건 자동차',page:'105쪽',t0:0,t1:2,unit:true,...fromPoly([0,19.6,-4.9])},
  {id:'s3',chip:'스스로 3',title:'쏘아 올린 물체',page:'106쪽',t0:0,t1:8,unit:true,...fromPoly([0,40,-5])},
  {id:'cube',chip:'멈춤 ≠ 전환',title:'멈췄는데 돌아서지 않는 점',page:'반례',t0:0,t1:2,unit:false,...fromPoly([-1,3,-3,1]),xh:'(<i>t</i> '+MINUS+' 1)<sup>3</sup>'},
  {id:'elev',chip:'엘리베이터',title:'올라갔다 내려오는 엘리베이터',page:'도입',t0:0,t1:11,unit:true,icon:'elev',...elevator},
];

/* ---------- 직접 입력 파서 ---------- */
function compile(src){
  const s=src.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/²/g,'^2').replace(/³/g,'^3').toLowerCase();
  if(!s) throw Error('식을 입력해 주세요');
  let i=0; const pk=()=>s[i];
  const FN={sin:Math.sin,cos:Math.cos,sqrt:Math.sqrt,exp:Math.exp,ln:Math.log};

function findEvents(P,arr,eps){

    if(a!==0&&b!==0&&a!==b){ let lo=arr[i-1].t,hi=arr[i].t; for(let k=0;k<50;k++){const m=(lo+hi)/2; if(Math.sign(P.v(m))===a) lo=m; else hi=m;} ev.push({t:(lo+hi)/2,type:'turn'}); i++; continue; }

  const size=W<560?26:32;
  const rot=!ic.fixed&&!ic.spin;
  const nose=(rot&&S.face&&fState.facing<0)?-1:1;   // 머리 방향: +1 위, −1 아래
  // 불꽃: 직접 운전에서 버튼을 누르는 동안만. 미는 방향의 반대쪽에서 뿜음 (▲ 아래, ▼ 위)
  if(S.flame&&rot&&S.mode==='drive'&&D.a!==0){
    const fs=20*(0.9+0.2*Math.random()); const fd=D.a>0?1:-1;
    ctx.save(); ctx.translate(sx,y+fd*(size*(ic.img?0.85:0.55)+fs*0.35)); if(fd>0) ctx.rotate(Math.PI);
    ctx.font=`${fs}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🔥',0,0); ctx.restore(); }
  ctx.save(); ctx.translate(sx,y);
  let ang=0;
  if(ic.spin) ang=c.x*0.9;
  else if(rot){ ang=ic.base; if(nose<0) ang+=Math.PI; }
  ctx.rotate(ang);
  if(ic.img){ const r=size*0.78; ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.clip(); ctx.drawImage(ic.img,-r,-r,2*r,2*r); ctx.restore();
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.lineWidth=2.5; ctx.strokeStyle=C.handle; ctx.stroke(); }
  else { ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ic.e,0,1); }
  ctx.restore();
}

/* ---------- 오른쪽 패널 ---------- */
function setCls(el,v,eps){ el.classList.remove('pos','neg','zer'); el.classList.add(v>eps?'pos':v<-eps?'neg':'zer'); }
function unitOn(){ return S.mode==='drive'||S.P.unit; }
function updateSide(){
  const c=cur(); const u=unitOn();
  $('rT').innerHTML=fmt(c.t,2)+(u?'<small>s</small>':'');
  $('rX').innerHTML=fmt(c.x,2)+(u?'<small>m</small>':'');
  $('rV').innerHTML=fmt(c.v,2)+(u?'<small>m/s</small>':''); setCls($('rV'),c.v,c.epsV);
  $('rA').innerHTML=fmt(c.a,2)+(u?'<small>m/s²</small>':''); setCls($('rA'),c.a,c.epsA);
  $('rS').textContent=fmt(Math.abs(c.v),2);
  const pd=$('pDir'); pd.className='pill';
  if(c.v>c.epsV){ pd.textContent='↑ 양의 방향'; pd.classList.add('pos'); }
  else if(c.v<-c.epsV){ pd.textContent='↓ 음의 방향'; pd.classList.add('neg'); }
  else { pd.textContent='● 멈춤'; pd.classList.add('zer'); }
  const ps=$('pSpd'); ps.className='pill';
  const pr=c.v*c.a;
  if(Math.abs(c.v)<=c.epsV&&Math.abs(c.a)>c.epsA){ ps.textContent='순간 정지'; ps.classList.add('neu'); }
  else if(Math.abs(c.a)<=c.epsA){ ps.textContent='일정'; ps.classList.add('neu'); }
  else if(pr>0){ ps.textContent='빨라지는 중'; ps.classList.add('neu'); }
  else { ps.textContent='느려지는 중'; ps.classList.add('neu'); }
  const br=$('bodyRow'); br.hidden=S.icon!=='elev';
  if(S.icon==='elev'){ const pb=$('pBody'); pb.className='pill';
    if(c.a>c.epsA){ pb.textContent='무거워짐'; pb.classList.add('pos'); }
    else if(c.a<-c.epsA){ pb.textContent='가벼워짐'; pb.classList.add('neg'); }
    else { pb.textContent='평소와 같음'; pb.classList.add('zer'); } }
  if(S.mode==='book'){ const P=S.P; $('tSlider').value=String(Math.round((S.t-P.t0)/(P.t1-P.t0)*1000)); }
  else { const fa=$('fa'); const k=D.a>0?0:D.a<0?2:1; fa.innerHTML=['+2 (▲)','0','−2 (▼)'].map((s,i)=>i===k?`<span class="on">${s}</span>`:s).join('<span class="txt">  /  </span>'); }
}

/* ---------- 알림 ---------- */
let toastTimer=0;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.hidden=false; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},1700); }

/* ---------- 재생 ---------- */
function updatePlayBtn(){ $('bPlay').textContent=S.playing?'❚❚ 멈춤':'▶ 재생'; }
$('bPlay').onclick=()=>{ if(S.playing){S.playing=false;} else { if(S.t>=S.P.t1-1e-9) S.t=S.P.t0; S.playing=true; } updatePlayBtn(); };
$('bReset').onclick=()=>{ S.playing=false; S.t=S.P.t0; updatePlayBtn(); };
document.querySelectorAll('#spdSeg button').forEach(b=>b.onclick=()=>{ S.runSec=+b.dataset.s; document.querySelectorAll('#spdSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
$('tSlider').addEventListener('input',e=>{ S.playing=false; updatePlayBtn(); const P=S.P; S.t=P.t0+(P.t1-P.t0)*(+e.target.value)/1000; });

// 캔버스에서 끌어 시각 바꾸기
let scrubbing=false;
function scrubTo(ev){ const r=cv.getBoundingClientRect(); const G=lay(); const P=S.P;
  const f=Math.max(0,Math.min(1,(ev.clientX-r.left-G.L)/(G.R-G.L))); S.t=P.t0+f*(P.t1-P.t0); }
cv.addEventListener('pointerdown',ev=>{ if(S.mode!=='book') return; const r=cv.getBoundingClientRect(); if(ev.clientX-r.left<lay().L-12) return;
  scrubbing=true; S.playing=false; updatePlayBtn(); cv.setPointerCapture(ev.pointerId); scrubTo(ev); });
cv.addEventListener('pointermove',ev=>{ if(scrubbing) scrubTo(ev); });
const endScrub=()=>{scrubbing=false}; cv.addEventListener('pointerup',endScrub); cv.addEventListener('pointercancel',endScrub);

/* ---------- 직접 운전 ---------- */
function resetDrive(){ Object.assign(D,{t:0,x:0,v:0,a:0,hist:[{t:0,x:0,v:0,a:0}],running:false,done:false,events:[],facing:1}); }
function bump(){ D.bumpT=performance.now(); toast('쿵!'); }
function stepDrive(dt){
  if(D.done) return;
  if(!D.running){ if(D.up||D.down) D.running=true; else return; }
  const A=2; D.a=(D.up?A:0)+(D.down?-A:0);
  const n=4,h=dt/n;
  for(let k=0;k<n;k++){ const pv=D.v; D.v+=D.a*h; D.x+=D.v*h; D.t+=h;
    if(D.x>10){ D.x=10; if(D.v>0.05) bump(); D.v=Math.min(D.v,0); }
    if(D.x<-10){ D.x=-10; if(D.v<-0.05) bump(); D.v=Math.max(D.v,0); }
    if(pv*D.v<0){ D.events.push({t:D.t,x:D.x,type:'turn'}); toast('방향 전환!'); }
    if(D.t>=20){ D.t=20; D.done=true; break; } }
  D.hist.push({t:D.t,x:D.x,v:D.v,a:D.a});
  if(D.done){ D.up=D.down=false; D.a=0; setHeld(); toast('20초 끝! ‘처음부터’를 누르세요'); }
}
function setHeld(){ $('bUp').classList.toggle('held',D.up); $('bDown').classList.toggle('held',D.down); }
function hold(btn,key){
  const on=e=>{ e.preventDefault(); if(D.done) return; D[key]=true; setHeld(); try{btn.setPointerCapture(e.pointerId);}catch(_){} };
  const off=()=>{ D[key]=false; setHeld(); };
  btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off); btn.addEventListener('pointercancel',off); btn.addEventListener('lostpointercapture',off);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
hold($('bUp'),'up'); hold($('bDown'),'down');
window.addEventListener('keydown',e=>{ if(S.mode!=='drive'||D.done) return; if(e.key==='ArrowUp'){D.up=true;setHeld();e.preventDefault();} if(e.key==='ArrowDown'){D.down=true;setHeld();e.preventDefault();} });
window.addEventListener('keyup',e=>{ if(e.key==='ArrowUp'){D.up=false;setHeld();} if(e.key==='ArrowDown'){D.down=false;setHeld();} });
$('bDReset').onclick=resetDrive;

/* ---------- 모드 · 아이콘 · 옵션 ---------- */
function setMode(m){ S.mode=m; $('mBook').setAttribute('aria-pressed',String(m==='book')); $('mDrive').setAttribute('aria-pressed',String(m==='drive'));
  $('bookCtl').hidden=m!=='book'; $('playbar').hidden=m!=='book'; $('driveCtl').hidden=m!=='drive'; requestAnimationFrame(resize);
  if(m==='drive'){ S.playing=false; updatePlayBtn(); resetDrive();
    $('pTitle').innerHTML='<b>직접 운전</b> 버튼으로 미는 운동'; $('pPage').textContent='';
    $('fx').innerHTML='<span class="txt">식 없음 — 버튼으로 움직여요</span>'; $('fv').innerHTML='<span class="txt">위치의 순간변화율</span>'; }
  else loadPreset(S.P); }
$('mBook').onclick=()=>setMode('book'); $('mDrive').onclick=()=>setMode('drive');
function setIcon(id){ S.icon=id; document.querySelectorAll('#icons button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id))); }
function renderIcons(){
  $('icons').innerHTML=ICONS.map(i=>`<button data-id="${i.id}" aria-pressed="false" title="${i.name}"><span class="em">${i.img?`<img src="${i.src}" alt="">`:i.e}</span><span class="nm">${i.name}</span></button>`).join('')
    +'<button id="bPhoto" type="button" title="사진 넣기"><span class="em">📷</span><span class="nm">사진 넣기</span></button>';
  document.querySelectorAll('#icons button[data-id]').forEach(b=>b.onclick=()=>setIcon(b.dataset.id));
  $('bPhoto').onclick=()=>$('photoIn').click();
  setIcon(S.icon);
}
function addPhoto(src,select=true){
  const img=new Image(); img.onload=()=>{
    const i=ICONS.findIndex(x=>x.id==='photo'); const ent={id:'photo',name:'사진',img,src,base:0};
    if(i>=0) ICONS[i]=ent; else ICONS.push(ent); if(select) S.icon='photo'; renderIcons(); }; img.src=src; }
$('photoIn').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{
      const N=160, cvs=document.createElement('canvas'); cvs.width=cvs.height=N; const g=cvs.getContext('2d');
      const m=Math.min(im.width,im.height); g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,N,N);
      const url=cvs.toDataURL('image/jpeg',0.85); try{localStorage.setItem('motionLabPhoto',url);}catch(_){} addPhoto(url); };
    im.onerror=()=>toast('이 사진은 열 수 없어요'); im.src=rd.result; }; rd.readAsDataURL(f); });
renderIcons();
try{ const saved=localStorage.getItem('motionLabPhoto'); if(saved) addPhoto(saved,false); }catch(_){}
$('oPrev').onchange=e=>S.preview=e.target.checked; $('oFace').onchange=e=>S.face=e.target.checked; $('oFlame').onchange=e=>S.flame=e.target.checked;

$('chips').innerHTML=PRESETS.map(p=>`<button class="chip" data-id="${p.id}" aria-pressed="false">${p.chip}</button>`).join('');
document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{ const P=PRESETS.find(p=>p.id===b.dataset.id); if(S.icon==='elev'&&!P.icon) setIcon('rocket'); loadPreset(P); });
$('cGo').onclick=()=>{ const err=$('cErr'); err.textContent='';
  try{ const t0=parseFloat($('c0').value),t1=parseFloat($('c1').value); if(!(t1>t0)) throw Error('t 범위의 끝이 시작보다 커야 해요');
    loadPreset(customPreset($('cx').value,t0,t1)); }catch(e){ err.textContent=e.message; } };
$('cx').addEventListener('keydown',e=>{ if(e.key==='Enter') $('cGo').click(); });

/* ---------- 루프 ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(S.mode==='book'&&S.playing){ const P=S.P; const nt=Math.min(P.t1,S.t+dt*(P.t1-P.t0)/S.runSec);
    for(const e of S.events) if(S.t<e.t&&e.t<=nt) toast(e.type==='turn'?'방향 전환!':'멈췄는데… 방향은 그대로');
    S.t=nt; if(S.t>=P.t1){ S.playing=false; updatePlayBtn(); } }
  if(S.mode==='drive') stepDrive(dt);
  draw(); updateSide(); requestAnimationFrame(frame);
}
const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener?.('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
readColors(); resize(); setIcon('rocket'); loadPreset(PRESETS.find(p=>p.id==='ex2'));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
})();
</script>
